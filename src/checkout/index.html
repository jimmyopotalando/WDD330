<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <header class="divider">
    <div class="logo">
      <img src="../images/logo.png" alt="Sleep Outside Logo" />
      <a href="../index.html">Sleep Outside</a>
    </div>
  </header>

  <main class="divider">
    <h1>Checkout</h1>

    <form id="checkout-form">
      <fieldset>
        <legend>Customer Information</legend>

        <label>
          First Name
          <input type="text" name="fname" required />
        </label>

        <label>
          Last Name
          <input type="text" name="lname" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Address</legend>

        <label>
          Street Address
          <input type="text" name="street" required />
        </label>

        <label>
          City
          <input type="text" name="city" required />
        </label>

        <label>
          State
          <input type="text" name="state" required />
        </label>

        <label>
          Zip Code
          <input type="text" name="zip" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Payment</legend>

        <label>
          Credit Card Number
          <input type="text" name="cardNumber" inputmode="numeric" autocomplete="cc-number" required />
        </label>

        <label>
          Expiration Date
          <input type="text" name="expiration" placeholder="MM/YY" autocomplete="cc-exp" required />
        </label>

        <label>
          Security Code
          <input type="text" name="code" inputmode="numeric" autocomplete="cc-csc" required />
        </label>
      </fieldset>

      <button type="submit">Checkout</button>
    </form>

    <section class="checkout order-summary">
      <h2>Order Summary</h2>

      <p>Subtotal: <span id="subtotal">$0.00</span></p>
      <p>Tax: <span id="tax">$0.00</span></p>
      <p>Shipping: <span id="shipping">$0.00</span></p>
      <p>Order Total: <span id="orderTotal">$0.00</span></p>
    </section>
  </main>

  <footer>
    <p>&copy; Sleep Outside</p>
  </footer>

  <script src="../js/checkout.js" type="module"></script>
</body>

</html>
